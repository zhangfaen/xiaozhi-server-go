    url: https://ark.cn-beijing.volces.com/api/v3
    api_key: 你的api_key
    thinking: disabled # 思考模式: disabled(关闭思考) 或 enabled(启用思考)
    max_tokens: 4000
  CozeLLM:
    # 定义LLM API类型
    type: coze
    bot_id: 你的bot_id
    user_id: 你的user_id
    # 正式环境
